plugins {
    id 'java-library'
}


subprojects {
    group = 'serap'
    apply plugin: 'java-library'
    //apply plugin: 'com.gradleup.shadow'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
    test {
        useJUnitPlatform()
    }
}
