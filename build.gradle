plugins {
    id 'java-library'
    //id 'com.gradleup.shadow' version '9.3.0' apply false
}


subprojects {
    group = 'serap'
    apply plugin: 'java-library'
    //apply plugin: 'com.gradleup.shadow'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
    test {
        useJUnitPlatform()
    }
}

